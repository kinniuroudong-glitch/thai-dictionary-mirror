<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>泰语</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="site-shell" id="app">
      <div class="topbar-shell" id="topbarShell">
        <button
          type="button"
          class="topbar-reveal-trigger"
          id="topbarReveal"
          aria-label="显示项目栏"
          title="显示项目栏"
          hidden
        ></button>
        <header class="topbar">
          <div class="project-controls">
            <label class="project-picker">
              <span class="sr-only">项目</span>
              <select id="projectSelect" aria-label="项目"></select>
            </label>
            <button
              type="button"
              class="bar-toggle"
              id="barToggle"
              aria-label="隐藏项目栏"
              title="隐藏项目栏"
            >−</button>
          </div>
          <label class="search-box">
            <span class="sr-only">搜索</span>
            <input id="searchInput" type="search" placeholder="搜索" aria-label="搜索" />
          </label>
        </header>
      </div>
      <section class="entry-list" id="entryList" aria-live="polite"></section>
      <div class="load-more" id="loadMore" aria-hidden="true"></div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
